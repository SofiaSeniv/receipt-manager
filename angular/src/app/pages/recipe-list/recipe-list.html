<h1>Recipe <span>Vault</span></h1>

<search class="toolbar">
    <input type="text" placeholder="Пошук рецептів..." class="search-input" [value]="store.searchQuery()"
        (input)="onSearch($event)">

    <div role="group" aria-label="Фільтр за категорією" class="filters">
        @for (f of filters; track f.key) {
        <button class="filter-btn" [class.active]="store.categoryFilter() === f.key"
            (click)="store.setCategoryFilter(f.key)">
            {{ f.label }}
        </button>
        }
    </div>

    <button type="button" class="new-recipe-btn" (click)="openCreateForm()">+ Новий рецепт</button>
</search>

@if (formVisible()) {
<app-recipe-form (closed)="closeForm()" />
}

<section class="recipe-grid">
    @for (recipe of store.filteredRecipes(); track recipe.id) {
    <app-recipe-card [recipe]="recipe" />
    } @empty {
    <p>Нічого не знайдено.</p>
    }
</section>
